# Configuration Netlify - site DentaFlow
# Le depot est connecte a Netlify : chaque push deploie automatiquement.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
